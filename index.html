<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GiuriQuiz" />
  <meta name="theme-color" content="#0f172a" />
  <title>GiuriQuiz — Studio Giurisprudenza</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="btn-back" class="icon-btn hidden" aria-label="Indietro">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">
        <span class="brand-dot">⚖️</span>
        <span id="header-title">GiuriQuiz</span>
      </div>
      <button id="btn-theme" class="icon-btn" aria-label="Cambia tema" title="Cambia tema">🌙</button>
    </header>

    <main id="main-content" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Caricamento materiali di studio...</p>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
